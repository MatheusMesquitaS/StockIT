<!doctype html>
<html lang="{{ idioma_atual }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>StockIT</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/logo-mark.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
</head>
<body class="login-page">
    <div class="login-card">
        <div class="login-brand">
            <img src="{{ url_for('static', filename='img/logo-full.svg') }}" class="logo-login" alt="StockIT">
        </div>
        <p>{{ tr('login_subtitle') }}</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for cat, msg in messages %}
            <div class="alert {{ cat }}">{{ msg }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" class="login-form">
            <label>{{ tr('username') }}</label>
            <input name="usuario" placeholder="{{ tr('username') }}" required autofocus>
            <label class="mt-14">{{ tr('password') }}</label>
            <input name="senha" type="password" placeholder="{{ tr('password') }}" required>
            <button class="btn primary full mt-18">{{ tr('login') }}</button>
        </form>
        <a href="{{ url_for('novo_acesso') }}" class="btn light full mt-18">{{ tr('create_new_access') }}</a>
    </div>
</body>
</html>
