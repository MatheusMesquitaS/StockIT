{% extends "base.html" %}
{% block content %}
<div class="topbar">
    <div>
        <h1>{{ tr('change_password') }}</h1>
        <p>{{ tr('password_security_help') }}</p>
    </div>
</div>

<div class="panel access-card">
    <div class="panel-body">
        <form method="POST" class="form-grid">
            <div class="col-2">
                <label>{{ tr('current_password') }}</label>
                <input type="password" name="senha_atual" required>
            </div>
            <div>
                <label>{{ tr('new_password') }}</label>
                <input type="password" name="nova_senha" required>
            </div>
            <div>
                <label>{{ tr('confirm_new_password') }}</label>
                <input type="password" name="confirmar_senha" required>
            </div>
            <div class="col-2 password-rules">
                <strong>{{ tr('password_rules') }}</strong>
                <ul>
                    <li>{{ tr('password_min_8') }}</li>
                    <li>{{ tr('password_number') }}</li>
                    <li>{{ tr('password_special') }}</li>
                </ul>
            </div>
            <div class="form-actions col-2">
                <button class="btn primary">{{ tr('save_new_password') }}</button>
                <a href="{{ url_for('dashboard') }}" class="btn light">{{ tr('cancel') }}</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
